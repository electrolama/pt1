format_version: 1
name: OOMP project summary
description: Repeatable monochrome styling for project Markdown and PCB SVG summaries.
colors:
  background: '#FFFFFF'
  board_fill: '#FFFFFF'
  board_outline: '#000000'
  component_fill: '#FFFFFF'
  component_outline: '#000000'
  text: '#000000'
  secondary_text: '#000000'
typography:
  family: Arial, sans-serif
  reference_size_mm: 0.72
  title_size_mm: 2.4
  mechanical_size_mm: 0.62
board_svg:
  margin_mm: 6.0
  mechanical_margin_mm: 8.0
  png_maximum_dimension: 1600
  board_corner_radius_mm: 1.0
  minimum_component_width_mm: 2.0
  minimum_component_height_mm: 1.4
  component_stroke_width_mm: 0.18
  board_stroke_width_mm: 0.35
  edge_cut_stroke_width_mm: 0.25
  mechanical_pad_stroke_width_mm: 0.18
  mounting_hole_stroke_width_mm: 0.22
  origin_stroke_width_mm: 0.18
  leader_stroke_width_mm: 0.12
  origin_axis_length_mm: 5.0
