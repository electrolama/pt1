oomlout_ai_roboclick_1:
    actions:
    -   command: run_python
        description: Clone or update the Git project and copy its selected KiCad files
            into the project part.
        file_python: kicad_agents/project_git_action.py
        project_file_basename: pt1-RevA2
        project_file_extensions:
        - .kicad_pcb
        - .kicad_sch
        - .kicad_pro
        project_file_folder: pcba/Rev A2
        project_file_path: pcba/Rev A2/pt1-RevA2
        project_git_ref: main
        project_git_url: https://github.com/electrolama/pt1.git
        project_github_repository: pt1
        project_github_url: https://github.com/electrolama/pt1
        project_github_user: electrolama
        project_match_overrides:
            CON1: electronic_connector_usb_c_surface_mount_16_pin_korean_hroparts_elec_typec31m12
            CON2: electronic_connector_usb_c_surface_mount_16_pin_korean_hroparts_elec_typec31m12
            CON3: electronic_connector_usb_a_surface_mount_4_pin_shenzhen_jing_tuo_jin_electronics_912121a2023s10100
            D1: electronic_diode_tvs_array_sot_23_6_protek_srv054pt7
            D2: electronic_diode_tvs_array_sot_23_6_protek_srv054pt7
            IC1: electronic_ic_qfn_16_3_mm_x_3_mm_converter_usb_to_serial_converter_wch_ch343p
            IC2: electronic_ic_sop_16_controller_usb_hub_controller_4_port_corechips_sl21a
            IC3: electronic_ic_sot_23_6_logic_configurable_multi_function_gate_texas_instruments_sn74lvc1g57dbvr
            IC4: electronic_ic_tsot_23_5_power_management_high_side_power_switch_with_flag_richtek_rt9742cgj5
            J1: electronic_connector_header_2_54_mm_pitch_through_hole_6_pin
            L1: electronic_ferrite_bead_0805_220_ohm_2_amp_murata_blm21pg221sn1d
            XT1: electronic_crystal_3225_surface_mount_4_pin_12_mhz_20_pf
        project_sparse_checkout: false
        project_version: current
        timeout: '600'
    file_test: ''
    retries_until_complete: 0
oomlout_ai_roboclick_2:
    actions:
    -   command: run_python
        description: Extract KiCad data and rebuild the project README, board SVGs,
            pin-labelled PNG, and mechanical layer.
        file_output: generated_data/src/board_pins.png
        file_python: kicad_agents/project_readme_action.py
        parts_directory: parts
        project_file_basename: pt1-RevA2
        project_file_extensions:
        - .kicad_pcb
        - .kicad_sch
        - .kicad_pro
        project_file_folder: pcba/Rev A2
        project_file_path: pcba/Rev A2/pt1-RevA2
        project_git_ref: main
        project_git_url: https://github.com/electrolama/pt1.git
        project_github_repository: pt1
        project_github_url: https://github.com/electrolama/pt1
        project_github_user: electrolama
        project_match_overrides:
            CON1: electronic_connector_usb_c_surface_mount_16_pin_korean_hroparts_elec_typec31m12
            CON2: electronic_connector_usb_c_surface_mount_16_pin_korean_hroparts_elec_typec31m12
            CON3: electronic_connector_usb_a_surface_mount_4_pin_shenzhen_jing_tuo_jin_electronics_912121a2023s10100
            D1: electronic_diode_tvs_array_sot_23_6_protek_srv054pt7
            D2: electronic_diode_tvs_array_sot_23_6_protek_srv054pt7
            IC1: electronic_ic_qfn_16_3_mm_x_3_mm_converter_usb_to_serial_converter_wch_ch343p
            IC2: electronic_ic_sop_16_controller_usb_hub_controller_4_port_corechips_sl21a
            IC3: electronic_ic_sot_23_6_logic_configurable_multi_function_gate_texas_instruments_sn74lvc1g57dbvr
            IC4: electronic_ic_tsot_23_5_power_management_high_side_power_switch_with_flag_richtek_rt9742cgj5
            J1: electronic_connector_header_2_54_mm_pitch_through_hole_6_pin
            L1: electronic_ferrite_bead_0805_220_ohm_2_amp_murata_blm21pg221sn1d
            XT1: electronic_crystal_3225_surface_mount_4_pin_12_mhz_20_pf
        project_sparse_checkout: false
        project_version: current
        regenerate_pngs: false
        timeout: '1200'
    -   allow_upscale: false
        command: image_resize
        file_destination: generated_data/src/board_300.png
        file_source: generated_data/src/board.png
        maximum_dimension: 300
        regenerate_pngs: false
        resample: lanczos
    -   allow_upscale: false
        command: image_resize
        file_destination: generated_data/src/board_pins_300.png
        file_source: generated_data/src/board_pins.png
        maximum_dimension: 300
        regenerate_pngs: false
        resample: lanczos
    -   allow_upscale: false
        command: image_resize
        file_destination: generated_data/src/board_bottom_300.png
        file_source: generated_data/src/board_bottom.png
        maximum_dimension: 300
        regenerate_pngs: false
        resample: lanczos
    -   allow_upscale: false
        command: image_resize
        file_destination: generated_data/src/board_pins_bottom_300.png
        file_source: generated_data/src/board_pins_bottom.png
        maximum_dimension: 300
        regenerate_pngs: false
        resample: lanczos
    -   allow_upscale: false
        command: image_resize
        file_destination: generated_data/src/board_mechanical_300.png
        file_source: generated_data/src/board_mechanical.png
        maximum_dimension: 300
        regenerate_pngs: false
        resample: lanczos
    file_test: ''
    retries_until_complete: 0
